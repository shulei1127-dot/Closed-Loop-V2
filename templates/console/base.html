<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }} · Closed Loop V2</title>
  <link rel="stylesheet" href="/static/console/console.css?v={{ static_rev }}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">CL</div>
        <div>
          <h1>Closed Loop V2</h1>
          <p>运营工作台</p>
        </div>
      </div>
      <nav class="nav">
        <a href="/console" class="{{ 'active' if active_nav == 'dashboard' else '' }}">模块总览</a>
        <a href="/console/modules/visit" class="{{ 'active' if active_nav == 'module_visit' else '' }}">交付转售后回访</a>
        <a href="/console/modules/proactive" class="{{ 'active' if active_nav == 'module_proactive' else '' }}">超半年主动回访</a>
        <a href="/console/modules/review" class="{{ 'active' if active_nav == 'module_review' else '' }}">交付转售后审核</a>
        <a href="/console/tasks" class="{{ 'active' if active_nav == 'tasks' else '' }}">任务</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          {% if page_title %}<h2>{{ page_title }}</h2>{% endif %}
        </div>
        <div class="topbar-actions">
          <a href="/console" class="ghost-link">返回总览</a>
        </div>
      </header>

      <section id="feedback-panel" class="feedback-panel hidden"></section>

      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/console/app.js?v={{ static_rev }}"></script>
</body>
</html>
