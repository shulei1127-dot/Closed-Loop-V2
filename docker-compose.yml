services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: closed_loop_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8200:8200"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${DB_PASSWORD:-postgres}@db:5432/closed_loop_v2
      PTS_BROWSER_PROFILE_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: